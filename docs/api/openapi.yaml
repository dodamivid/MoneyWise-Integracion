openapi: 3.0.3
info:
  title: MoneyWise API
  version: "1.0.0"
  description: |
    Spec mínima para consumo del frontend.
    Base URL de producción: https://moneywise-integracion-production.up.railway.app
servers:
  - url: https://moneywise-integracion-production.up.railway.app
    description: Prod
  - url: http://localhost:3000
    description: Local
tags:
  - name: Auth
  - name: Usuarios
  - name: Salud
paths:
  /health:
    get:
      tags: [Salud]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/v1/auth/registro:
    post:
      tags: [Auth]
      summary: Registro de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellidoP, apellidoM, correo, fechaN, contrasena]
              properties:
                nombre: { type: string }
                apellidoP: { type: string }
                apellidoM: { type: string }
                correo: { type: string, format: email }
                fechaN: { type: string, format: date }
                contrasena: { type: string, format: password }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      usuarioId: { type: integer }
                      correo: { type: string }
  /api/v1/auth/acceso:
    post:
      tags: [Auth]
      summary: Login y obtención de token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo: { type: string, format: email }
                contrasena: { type: string, format: password }
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      usuario:
                        type: object
                        properties:
                          usuarioId: { type: integer }
                          correo: { type: string }
  /api/users/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      usuarioId: { type: integer }
                      correo: { type: string }
                      nombre: { type: string }
        "404":
          description: No encontrado
  /api/v1/version:
    get:
      tags: [Salud]
      summary: Versión del servicio
      responses:
        "200":
          description: OK
