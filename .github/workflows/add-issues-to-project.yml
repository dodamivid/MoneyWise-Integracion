name: Add issues to Project (Integration)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub login del dueño del Project (user u org)
        required: false
      project_number:
        description: Número del Project (ej. 2 si la URL es users/<login>/projects/2)
        required: false
      label:
        description: Importar issues abiertos con esta etiqueta (por defecto integration)
        required: false
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: read
  issues: read

jobs:
  add_to_project:
    runs-on: ubuntu-latest
    env:
      PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
    steps:
      - name: Ensure token secret exists
        if: ${{ env.PROJECT_PAT == '' }}
        run: echo "::warning::Secret PROJECT_PAT no configurado. Lee README para crearlo."
      - name: Add issue(s) to Project V2
        if: ${{ env.PROJECT_PAT != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PROJECT_PAT }}
          script: |
            const owner = core.getInput('owner') || context.repo.owner;
            const projectNumber = Number(core.getInput('project_number') || process.env.PROJECT_NUMBER || 2);
            const importLabel = core.getInput('label') || 'integration';

            // 1) Get Project ID and Status field/options
            const projectData = await github.graphql(`
              query($login:String!,$number:Int!){
                user(login:$login){
                  projectV2(number:$number){ id fields(first:50){ nodes{
                    ... on ProjectV2FieldCommon { id name }
                    ... on ProjectV2SingleSelectField { id name options{ id name } }
                  }}}
                }
                organization(login:$login){
                  projectV2(number:$number){ id fields(first:50){ nodes{
                    ... on ProjectV2FieldCommon { id name }
                    ... on ProjectV2SingleSelectField { id name options{ id name } }
                  }}}
                }
              }
            `, { login: owner, number: projectNumber });

            const project = projectData.user?.projectV2 || projectData.organization?.projectV2;
            if (!project) throw new Error(`No se encontró Project ${projectNumber} para ${owner}`);
            const projectId = project.id;
            const fields = project.fields.nodes;
            const statusField = fields.find(f => f.name === 'Status');
            const todoOption = statusField?.options?.find(o => o.name.toLowerCase() === 'todo') || statusField?.options?.[0];

            async function addIssueNodeId(nodeId){
              // Add item to project
              const addRes = await github.graphql(`
                mutation($projectId:ID!,$contentId:ID!){
                  addProjectV2ItemById(input:{projectId:$projectId, contentId:$contentId}){ item { id } }
                }
              `, { projectId, contentId: nodeId });
              const itemId = addRes.addProjectV2ItemById.item.id;

              // Set Status = Todo if available
              if (statusField && todoOption){
                await github.graphql(`
                  mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:String!){
                    updateProjectV2ItemFieldValue(input:{
                      projectId: $projectId,
                      itemId: $itemId,
                      fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }){ projectV2Item { id } }
                  }
                `, { projectId, itemId, fieldId: statusField.id, optionId: todoOption.id });
              }
            }

            if (context.eventName === 'issues'){
              const issue = context.payload.issue;
              // If it's a label event, ensure label matches
              const action = context.payload.action;
              if (action === 'labeled' && context.payload.label?.name !== importLabel){
                core.info(`Etiqueta '${context.payload.label?.name}' no coincide con '${importLabel}'. Skipping.`);
                return;
              }
              // Only handle opened/labeled/reopened
              const nodeId = issue.node_id;
              try {
                await addIssueNodeId(nodeId);
                core.notice(`Issue #${issue.number} agregado al Project ${projectNumber}.`);
              } catch (e){
                core.warning(`No se pudo agregar #${issue.number}: ${e.message}`);
              }
              return;
            }

            // workflow_dispatch: import all open issues filtered by label
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: importLabel,
              per_page: 100,
            });

            let count = 0;
            for (const it of issues){
              try {
                await addIssueNodeId(it.node_id);
                count++;
              } catch(e){
                core.warning(`Skip #${it.number}: ${e.message}`);
              }
            }
            core.notice(`Importados ${count} issues al Project ${projectNumber} de ${owner}.`);
